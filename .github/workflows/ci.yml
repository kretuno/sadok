name: Continuous Integration

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/client/package-lock.json
            apps/server/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install client dependencies
        run: npm ci --prefix apps/client

      - name: Install server dependencies
        run: npm ci --prefix apps/server

      - name: Run server tests
        run: npm test

      - name: Lint client
        run: npm run lint --prefix apps/client

      - name: Build client
        run: npm run build --prefix apps/client

      - name: Build server
        run: npm run build --prefix apps/server

      - name: Prepare Windows server runtime
        if: matrix.os == 'windows-latest'
        run: node scripts/prepare-server-runtime.js --arch=x64

      - name: Package Windows installer
        if: matrix.os == 'windows-latest'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Upload Windows installer smoke artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: sadok-windows-x64-${{ github.sha }}
          path: Install/*.exe
          if-no-files-found: error
          retention-days: 7
