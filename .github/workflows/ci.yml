name: Continuous Integration

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/client/package-lock.json
            apps/server/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install client dependencies
        run: npm ci --prefix apps/client

      - name: Install server dependencies
        run: npm ci --prefix apps/server

      - name: Run server tests
        run: npm test

      - name: Lint client
        run: npm run lint --prefix apps/client

      - name: Build client
        run: npm run build --prefix apps/client

      - name: Build server
        run: npm run build --prefix apps/server
